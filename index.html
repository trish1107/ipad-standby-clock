<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StandBy">
  <meta name="theme-color" content="#000000">
  <title>StandBy Clock</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #f5f5f5; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; transition: color .35s ease;
    }
    main { width: 100%; text-align: center; padding: 24px; }
    #time {
      font-size: 21vw; font-weight: 200; letter-spacing: -.075em; line-height: 1;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #date {
      margin-top: 17px; font-size: 3.4vw; font-weight: 400;
      letter-spacing: .12em; color: #929292;
    }
    #night-toggle {
      position: absolute; left: 22px; bottom: 20px;
      width: 54px; height: 54px; padding: 0;
      border: 1px solid rgba(255,255,255,.28); border-radius: 50%;
      background: rgba(255,255,255,.08); color: #f2f2f2;
      font-family: Arial, sans-serif; font-size: 30px; line-height: 52px;
      text-align: center; cursor: pointer; outline: none;
      -webkit-appearance: none; appearance: none;
    }
    #night-toggle:active { background: rgba(255,255,255,.2); }
    body.night { color: #ff453a; }
    body.night #date { color: #9e302b; }
    body.night #night-toggle {
      color: #ff6258; border-color: rgba(255,69,58,.5);
      background: rgba(255,69,58,.12);
    }
    @media (orientation: portrait) {
      #time { font-size: 18vw; }
      #date { font-size: 4vw; }
    }
  </style>
</head>
<body>
  <main aria-label="StandBy clock">
    <div id="time">--:--</div>
    <div id="date">LOADING DATE</div>
  </main>
  <button id="night-toggle" type="button" aria-label="Switch to night mode" title="Night mode">☾</button>
  <script>
    (function () {
      var time = document.getElementById('time');
      var date = document.getElementById('date');
      var toggle = document.getElementById('night-toggle');
      function update() {
        var now = new Date();
        var h = String(now.getHours());
        var m = String(now.getMinutes());
        if (h.length < 2) h = '0' + h;
        if (m.length < 2) m = '0' + m;
        time.textContent = h + ':' + m;
        var days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
        var months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
        date.textContent = days[now.getDay()] + '  ·  ' + now.getDate() + ' ' + months[now.getMonth()];
      }
      update();
      window.setInterval(update, 1000);
      toggle.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        var night = document.body.classList.toggle('night');
        toggle.textContent = night ? '☀' : '☾';
        toggle.setAttribute('aria-label', night ? 'Switch to normal mode' : 'Switch to night mode');
      }, false);
    })();
  </script>
</body>
</html>
