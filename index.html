<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StandBy">
  <meta name="theme-color" content="#000000">
  <title>StandBy Clock</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: #000; color: #f5f5f5;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: color .35s ease;
    }
    main { width: 100%; text-align: center; padding: 24px; }
    /* Avoid CSS clamp(): the iPad mini 2 runs Safari 12, which does not support it. */
    #time {
      font-size: 19vw;
      font-weight: 200; letter-spacing: -.075em; line-height: 1;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #date {
      margin-top: 24px; font-size: 3.4vw;
      font-weight: 400; letter-spacing: .12em; color: #929292;
    }
    #hint {
      position: absolute; bottom: 18px; left: 0; right: 0;
      text-align: center; color: #414141; font-size: 11px; letter-spacing: .12em;
      opacity: 0; transition: opacity .3s;
    }
    body.show-hint #hint { opacity: 1; }
    body.night { color: #ff453a; }
    body.night #date { color: #9e302b; }
    body.night #hint { color: #70231f; }
    @media (orientation: portrait) {
      #time { font-size: 17vw; }
      #date { font-size: 4vw; }
    }
  </style>
</head>
<body>
  <main aria-label="StandBy clock">
    <div id="time">--:--</div>
    <div id="date">LOADING DATE</div>
  </main>
  <div id="hint">TAP ANYWHERE · SWITCH NIGHT MODE</div>
  <script>
    (function () {
      var time = document.getElementById('time');
      var date = document.getElementById('date');
      var hintTimer;
      function update() {
        var now = new Date();
        var h = String(now.getHours());
        var m = String(now.getMinutes());
        if (h.length < 2) h = '0' + h;
        if (m.length < 2) m = '0' + m;
        time.textContent = h + ':' + m;
        var days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
        var months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
        date.textContent = days[now.getDay()] + '  ·  ' + now.getDate() + ' ' + months[now.getMonth()];
      }
      update();
      window.setInterval(update, 1000);
      function toggleNight() {
        document.body.classList.toggle('night');
        document.body.classList.add('show-hint');
        window.clearTimeout(hintTimer);
        hintTimer = window.setTimeout(function () {
          document.body.classList.remove('show-hint');
        }, 1800);
      }
      document.addEventListener('click', toggleNight, false);
    })();
  </script>
</body>
</html>
